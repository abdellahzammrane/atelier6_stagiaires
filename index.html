<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscription Stagiaire</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 40px 20px;
            background: #f3f6fb;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }
        main { max-width: 620px; margin: 0 auto; }
        h1 { margin: 0 0 22px; color: #17345c; font-size: 30px; }
        form {
            padding: 24px;
            background: #fff;
            border: 1px solid #e1e7f0;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(25, 52, 92, .07);
        }
        .field { display: block; margin-bottom: 18px; font-weight: 600; }
        .field input {
            display: block;
            width: 100%;
            margin-top: 7px;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            background: #fff;
            color: #1f2937;
            font: inherit;
        }
        .field input:focus { outline: 2px solid #93c5fd; border-color: #3b82f6; }
        .field input[type="file"] { padding: 9px; }
        button {
            padding: 10px 18px;
            border: 0;
            border-radius: 7px;
            background: #2563eb;
            color: #fff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        a { display: inline-block; margin-top: 16px; color: #1d4ed8; }
        #message {
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 7px;
            background: #eaf2ff;
            color: #17345c;
            font-weight: 600;
        }
        #message:empty { display: none; }
        @media (max-width: 480px) {
            body { padding: 28px 14px; }
            form { padding: 18px; }
            h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Inscription Stagiaire</h1>
        <form id="inscriptionForm" enctype="multipart/form-data">
            <label class="field">Nom
                <input type="text" name="nom" required>
            </label>
            <label class="field">Prénom
                <input type="text" name="prenom" required>
            </label>
            <label class="field">Ville
                <input type="text" name="ville" required>
            </label>
            <label class="field">Photo
                <input type="file" name="photo" accept="image/*" required>
            </label>
            <button type="submit">Inscrire</button>
        </form>
        <a href="liste.html">Voir la liste</a>
        <div id="message" role="status" aria-live="polite"></div>
    </main>

    <script>
        document.getElementById('inscriptionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            try {
                const response = await fetch('/api/inscrire.php', {
                    method: 'POST',
                    body: formData
                });
                const responseText = await response.text();
                const contentType = response.headers.get('content-type') || '';
                if (!contentType.includes('application/json')) {
                    if (response.ok) {
                        throw new Error("L'API PHP ne s'execute pas sur cette adresse. Utilisez l'URL Vercel ou lancez un serveur PHP.");
                    }
                    throw new Error(`Reponse API invalide (HTTP ${response.status}).`);
                }
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch {
                    throw new Error(`L'API a renvoye du JSON invalide (HTTP ${response.status}).`);
                }
                if (!response.ok) {
                    throw new Error(result.error || `Erreur HTTP ${response.status}.`);
                }
                document.getElementById('message').innerText = result.message || 'Inscription terminee.';
            } catch (error) {
                const message = error instanceof TypeError
                    ? "Impossible de joindre l'API. Verifiez que le serveur PHP est lance."
                    : error.message;
                document.getElementById('message').innerText = message || "Une erreur est survenue pendant l'inscription.";
            }
        });
    </script>
</body>
</html>
