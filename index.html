<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription Stagiaire</title>
</head>
<body>
    <h1>Inscription Stagiaire</h1>
    <form id="inscriptionForm" enctype="multipart/form-data">
        <label>Nom: <input type="text" name="nom" required></label><br><br>
        <label>Prénom: <input type="text" name="prenom" required></label><br><br>
        <label>Ville: <input type="text" name="ville" required></label><br><br>
        <label>Photo: <input type="file" name="photo" accept="image/*" required></label><br><br>
        <button type="submit">Inscrire</button>
    </form>
    <div id="message" style="margin-top: 20px; font-weight: bold;"></div>

    <script>
        document.getElementById('inscriptionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            try {
                const response = await fetch('/api/inscrire.php', {
                    method: 'POST',
                    body: formData
                });
                const responseText = await response.text();
                let result;
                try {
                    result = JSON.parse(responseText);
                } catch {
                    throw new Error(`Le serveur a repondu avec une erreur (HTTP ${response.status}).`);
                }
                if (!response.ok) {
                    throw new Error(result.error || `Erreur HTTP ${response.status}.`);
                }
                document.getElementById('message').innerText = result.message || 'Inscription terminee.';
            } catch (error) {
                const message = error instanceof TypeError
                    ? "Impossible de joindre l'API. Verifiez que le serveur PHP est lance."
                    : error.message;
                document.getElementById('message').innerText = message || "Une erreur est survenue pendant l'inscription.";
            }
        });
    </script>
</body>
</html>
